# JUnit logs the random seed at CONFIG, below the INFO level java.util.logging prints by default. Only the
# orderer's logger is raised, so the launcher's CONFIG lines (engine jars, their paths) stay out of the output.
handlers = java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level = CONFIG
java.util.logging.SimpleFormatter.format = %4$s: %5$s%n
org.junit.jupiter.api.level = CONFIG
