name: qubership-global-essentials
version: 2.0.0
description: Deprecated compatibility alias for the old user-workspace-baseline name. Resolves to qubership-user-essentials; depend on the new name directly. Carries no content of its own.

# Backward-compatibility shim: keep the old name resolvable and point it at
# the renamed user-workspace baseline. The member list is now composed
# through qubership-repo-essentials, hence the major-version bump.
#
# Published marketplace packages are installed as remote packages, so they
# cannot depend on sibling packages with filesystem-relative paths. The dep
# is branch-pinned because qubership-user-essentials first appears on this
# branch. TODO after merge: repin to a main commit SHA.
dependencies:
  apm:
    - Netcracker/qubership-ai-packages/agent-packages/qubership-user-essentials#feat/split-essentials
