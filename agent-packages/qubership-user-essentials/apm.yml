name: qubership-user-essentials
version: 1.0.0
description: "Umbrella package with the Qubership agent setup for a global user workspace: the repository baseline plus code review, repository onboarding, dependency PR triage, Renovate automerge, and ADR authoring."
dependencies:
  apm:
    # The per-repository baseline, so a global install carries the same rules
    # as any onboarded repository. Branch-pinned because the package first
    # appears on this branch. TODO after merge: repin to a main commit SHA.
    - Netcracker/qubership-ai-packages/agent-packages/qubership-repo-essentials#feat/split-essentials
    # Sibling packages in this repository. Published manifests cannot use
    # local-path deps, so each one is pinned to a commit SHA on this repo.
    - Netcracker/qubership-ai-packages/agent-packages/codex-review#ebbc567f900e00ea4ec6260536bb75c0d46ddd73  # main
    - Netcracker/qubership-ai-packages/agent-packages/triage-dependency-prs#ebbc567f900e00ea4ec6260536bb75c0d46ddd73  # main
    - Netcracker/qubership-ai-packages/agent-packages/enable-renovate-automerge#ebbc567f900e00ea4ec6260536bb75c0d46ddd73  # main
    - Netcracker/qubership-ai-packages/agent-packages/adr-authoring#ebbc567f900e00ea4ec6260536bb75c0d46ddd73  # main
    # qubership-agent-support-pr changes on this branch (it now installs
    # qubership-repo-essentials). TODO after merge: repin to a main commit SHA.
    - Netcracker/qubership-ai-packages/agent-packages/qubership-agent-support-pr#feat/split-essentials
