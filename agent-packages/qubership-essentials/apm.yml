name: qubership-essentials
version: 2.0.0
description: Deprecated compatibility alias for the old repository-baseline name. Resolves to qubership-repo-essentials, which no longer includes codex-review; depend on the new name directly. Carries no content of its own.

# Backward-compatibility shim: keep the old name resolvable and point it at
# the renamed repository baseline. codex-review left the baseline with the
# rename, hence the major-version bump.
#
# Published marketplace packages are installed as remote packages, so they
# cannot depend on sibling packages with filesystem-relative paths. The dep
# is branch-pinned because qubership-repo-essentials first appears on this
# branch. TODO after merge: repin to a main commit SHA.
dependencies:
  apm:
    - Netcracker/qubership-ai-packages/agent-packages/qubership-repo-essentials#feat/split-essentials
