name: blackbox-test-design
version: 1.0.0
description: "Rules for choosing the questions to send a system whose behavior is learned by querying it: a legacy service being ported, a vendor binary or API without source, a reference stand that answers a parity or golden suite. Covers where test dimensions come from, what an answer can tell apart, how a round of questions is chosen and budgeted, when to stop, and how findings are labeled."
