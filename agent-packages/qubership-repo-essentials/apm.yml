name: qubership-repo-essentials
version: 1.2.0
description: "Baseline agent setup for any Netcracker/Qubership repository: commit-message disclosure, APM authoring, English style, Markdown rules, documentation and change authoring, and workflow-hub usage."
dependencies:
  apm:
    # Sibling packages in this repository. Published manifests cannot use
    # local-path deps, so each one is pinned to a commit SHA on this repo.
    - Netcracker/qubership-ai-packages/agent-packages/apm-authoring#ebbc567f900e00ea4ec6260536bb75c0d46ddd73  # main
    - Netcracker/qubership-ai-packages/agent-packages/english-us-developer-style#ebbc567f900e00ea4ec6260536bb75c0d46ddd73  # main
    - Netcracker/qubership-ai-packages/agent-packages/markdown-line-length-120#ebbc567f900e00ea4ec6260536bb75c0d46ddd73  # main
    - Netcracker/qubership-ai-packages/agent-packages/change-description-authoring#834d1c9d6fd7824e6c07acbe55654e80a59eebac  # main
    - Netcracker/qubership-ai-packages/agent-packages/docs-page-authoring#834d1c9d6fd7824e6c07acbe55654e80a59eebac  # main
    # Packages hosted in other repositories.
    - Netcracker/qubership-workflow-hub/agent-packages/qubership-workflow-hub-usage#3511065e91edef101ca84ed1c88cfef7120dface  # main
