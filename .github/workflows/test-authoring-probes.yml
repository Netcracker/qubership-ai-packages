# Runs the framework probes under research/test-authoring/probes/ and the claims checker. A probe fails when a
# framework's output no longer matches its golden file, which is how a Renovate bump that changes the behavior a
# reference describes is kept from automerging. See research/test-authoring/probes/README.md.
name: Test-authoring probes

on:
  pull_request:
    branches:
      - '**'
  push:
    branches: [main]
    paths:
      - research/test-authoring/probes/**
      - agent-packages/test-authoring/**
      - .github/workflows/test-authoring-probes.yml
  schedule:
    # Weekly, so a framework release that Renovate has not opened a pull request for yet is still measured.
    - cron: '17 6 * * 1'
  workflow_dispatch: {}

permissions: {}

jobs:
  changes:
    name: Detect probe changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      probes: ${{ steps.filter.outputs.probes }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        name: Detect whether the probes must run
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "probes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c core.quotePath=false diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
          if grep -Eq '^(research/test-authoring/probes/.*|agent-packages/test-authoring/.*|\.github/workflows/test-authoring-probes\.yml)$' changed-files.txt; then
            echo "probes=true" >> "$GITHUB_OUTPUT"
          else
            echo "probes=false" >> "$GITHUB_OUTPUT"
          fi

  # One job per ecosystem, each with only the toolchain it needs. Adding an ecosystem is adding a job here and
  # naming it in the gate's needs and result loop.
  python-pytest:
    needs: changes
    if: ${{ needs.changes.outputs.probes == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Compare pytest output with the golden files
        run: research/test-authoring/probes/run.sh python-pytest

  claims:
    needs: changes
    if: ${{ needs.changes.outputs.probes == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Check every claim against the golden files and the references
        run: uv run --python 3.12 --no-project python research/test-authoring/probes/check-claims.py

  probes-gate:
    # The one status to require on main: it passes when the change detection skipped the probes, and fails when
    # any probe or the checker did not succeed.
    name: Test-authoring probes gate
    needs: [changes, python-pytest, claims]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the probe results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PROBES_REQUIRED: ${{ needs.changes.outputs.probes }}
          PYTHON_PYTEST_RESULT: ${{ needs.python-pytest.result }}
          CLAIMS_RESULT: ${{ needs.claims.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed or did not complete."
            exit 1
          fi
          if [[ "$PROBES_REQUIRED" != "true" ]]; then
            echo "The probes are not required for this change."
            exit 0
          fi
          failed=0
          for result in "$PYTHON_PYTEST_RESULT" "$CLAIMS_RESULT"; do
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "A probe or the claims checker failed or did not complete."
            exit 1
          fi
